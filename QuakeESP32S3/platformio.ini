; Quake for the Sunton ESP32-8048S050 (esp32-quake).
; Open THIS folder (QuakeESP32S3) in PlatformIO, then Build / Upload / Monitor.
; The board is selected in main/board_config.h (BOARD_SUNTON_8048S050 by default).

[env:esp32-8048S050]
; the same platform (ESP-IDF 5.5.3) that built the bring-up test
platform = espressif32 @ 6.13.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[platformio]
src_dir = main
description = Handheld QUAKE
