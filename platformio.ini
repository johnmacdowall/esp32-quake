; Sunton ESP32-8048S050 (ESP32-S3-WROOM-1 N16R8, 5" 800x480 RGB panel)
; Framework is ESP-IDF (not Arduino) - Quake needs the lower-level control.
; PSRAM, cache and LCD settings live in sdkconfig.defaults.

[env:esp32-8048S050]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = espidf

; 16MB flash, quad I/O
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
