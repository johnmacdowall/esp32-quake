; Audio pin test for the Sunton ESP32-8048S050 V1.3 (esp32-quake).
; Finds which GPIO carries the I2S bit clock of the onboard NS4168 amplifier (P6 "Speak").
; Open THIS folder in PlatformIO, Upload over USB, open the Monitor and listen.

[env:esp32-8048S050]
platform = espressif32 @ 6.13.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
monitor_speed = 115200
